services: 
  fileupload-srv:
    image: spring-file-upload:v1.0.0
    build: 
     context: . 
     dockerfile: dev.Dockerfile
     args: 
      - PORT=${APP_PORT:-8080}
    environment: 
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/ 
      SPRING_PROFILE_ACTIVE: ${SPRING_PROFILE:-dev}
    configs: 
      - source: spring-app-config 
        target: /app/config/application.yaml 
    pull_policy: build
    volumes: 
      - image-backup-vol:/app/filestorage/images
      - file-backup-vol:/app/filestorage/data 
    ports: 
      - 8080:${APP_PORT:-8080}
    restart: unless-stopped
    healthcheck:
      test: 
        - CMD-SHELL 
        - "wget -q --spider http://localhost:8282/actuator/health || exit 1 "
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

configs:
  spring-app-config: 
    file: ./config/application.yaml
volumes: 
  image-backup-vol:
  file-backup-vol: 
